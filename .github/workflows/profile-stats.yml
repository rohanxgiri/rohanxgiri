name: Update GitHub Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # -----------------------------------
      # 1. Main GitHub statistics
      # -----------------------------------

      - name: Generate Signal Field
        id: signal
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: signal-field

      - name: Save Signal Field
        env:
          READY_DIR: ${{ steps.signal.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$READY_DIR"/signal-field-wide-light.svg profile/
          cp "$READY_DIR"/signal-field-wide-dark.svg profile/
          cp "$READY_DIR"/signal-field-compact-light.svg profile/
          cp "$READY_DIR"/signal-field-compact-dark.svg profile/

      # -----------------------------------
      # 2. Contribution/activity statistics
      # -----------------------------------

      - name: Generate Activity Consistency
        id: activity
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Save Activity Consistency
        env:
          READY_DIR: ${{ steps.activity.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$READY_DIR"/activity-consistency-wide-light.svg profile/
          cp "$READY_DIR"/activity-consistency-wide-dark.svg profile/
          cp "$READY_DIR"/activity-consistency-compact-light.svg profile/
          cp "$READY_DIR"/activity-consistency-compact-dark.svg profile/

      # -----------------------------------
      # Commit generated SVGs
      # -----------------------------------

      - name: Publish generated cards
        run: |
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No stats changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update GitHub profile stats"
          git push
